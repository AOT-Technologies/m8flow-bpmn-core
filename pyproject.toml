[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "m8flow-core"
version = "1.0.0"
description = "An embeddable BPMN and DMN workflow engine for Python applications, the workflow core of m8flow."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AOT Technologies Inc.", email = "opensource@aot-technologies.com" }]
requires-python = ">=3.12,<4.0"
keywords = ["bpmn", "dmn", "workflow", "workflow-engine", "spiffworkflow", "m8flow"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "alembic>=1.16,<2.0",
  "defusedxml>=0.7,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "spiffworkflow>=3.1.2,<4.0",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2,<4.0"]
mysql = ["pymysql>=1.1,<2.0"]
celery = ["celery[redis]>=5.4,<6.0"]

[dependency-groups]
dev = [
  "bandit[toml]>=1.8,<2.0",
  "mypy>=1.11,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
]

[project.urls]
Homepage = "https://github.com/AOT-Technologies/m8flow-core"
Documentation = "https://github.com/AOT-Technologies/m8flow-core/tree/main/docs"
Issues = "https://github.com/AOT-Technologies/m8flow-core/issues"
Changelog = "https://github.com/AOT-Technologies/m8flow-core/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "integration",
  "alembic",
  "alembic.ini",
  "docs",
  "examples",
  "sample.env",
  "Makefile",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE",
]
exclude = ["__pycache__", "tests/test_check_dco.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/m8flow_core"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true
files = ["src/m8flow_core"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
  "m8flow_core.models.future_task",
  "m8flow_core.models.json_data",
  "m8flow_core.services.connector_proxy_service_tasks",
  "m8flow_core.services.process_definitions",
  "m8flow_core.services.scheduler_jobs",
  "m8flow_core.services.scheduler_runtime",
  "m8flow_core.services.workflow_runtime",
  "m8flow_core.utils.keycloak.service",
]
ignore_errors = true

[tool.bandit]
exclude_dirs = [
  "tests",
  "integration",
  "examples",
  "sample_app/tests",
]
