<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" width="960" height="316" role="img" aria-labelledby="t d">
  <title id="t">Scheduler job lifecycle</title>
  <desc id="d">Four columns, left to right. Create: importing a definition with a timer start event, saving a workflow that waits on a timer, or scheduling a retry for an errored instance each writes a job. Store: the scheduler_job row is upserted by tenant and job_key, with its run_at due time. Run: each call to run_due_scheduler_jobs lists due, unlocked jobs, claims them by setting locked_by, and runs them: starting an instance, advancing a workflow, or retrying it. Result: the job is rescheduled with its next due time and its lock cleared, or deleted because it is done, consumed, or stale. A blue dot follows a timer job from a saved workflow through the table and the run steps until it is deleted.</desc>
  <style>
    text { font-family: Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .t { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .b { font-size: 11.5px; fill: #6b7280; }
    .k { font-size: 10px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.08em; }
    .m { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
    .mi { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #111827; }
    .ln { fill: none; stroke: #d1d5db; stroke-width: 1; }
    .er { fill: none; stroke: #e01d5a; stroke-width: 1; stroke-opacity: .45; }
    .route { offset-rotate: 0deg; opacity: 0; }
    .hl { opacity: 0; animation: hl var(--d, 6s) ease-in-out infinite; animation-delay: var(--w, 0s); }
    .in { opacity: 0; animation: fadein var(--d, 8s) ease-out infinite; animation-delay: var(--w, 0s); }
    @keyframes hl { 0%, 22%, 100% { opacity: 0; } 4%, 16% { opacity: 1; } }
    @keyframes fadein { 0% { opacity: 0; transform: translateY(4px); } 8%, 82% { opacity: 1; transform: none; }
                        92%, 100% { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 8s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 70%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .hl, .route { animation: none !important; opacity: 0; }
      .in, .bar { animation: none; opacity: 1; }
    }
  </style>
  <rect width="960" height="316" rx="12" fill="#ffffff"/>
  <rect x=".5" y=".5" width="959" height="315" rx="12" fill="none" stroke="#e5e7eb"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#d1d5db"/></marker></defs>
  <rect x="24" y="24" width="210" height="240" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="38" y="46" class="k" text-anchor="start">CREATE</text>
  <rect x="258" y="24" width="210" height="240" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="272" y="46" class="k" text-anchor="start">STORE</text>
  <rect x="492" y="24" width="210" height="240" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="506" y="46" class="k" text-anchor="start">RUN</text>
  <rect x="726" y="24" width="210" height="240" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="740" y="46" class="k" text-anchor="start">RESULT</text>
  <text x="688" y="46" class="m" text-anchor="end">run_due_scheduler_jobs</text>
  <path class="ln" d="M220 149.0 L 272 149.0"/>
  <path class="ln" d="M454 149.0 L 480.0 149.0 L 480.0 85.0 L 506 85.0"/>
  <path class="ln" d="M597.0 110 L 597.0 124"/>
  <path class="ln" d="M597.0 174 L 597.0 188"/>
  <path class="ln" d="M688 213.0 L 740 213.0"/>
  <style>@keyframes r14 { 0% { offset-distance: 0%; opacity: 0; } 1% { opacity: 1; } 45.56% { opacity: 1; } 46.56% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }</style>
  <circle class="route" r="3" fill="#1a9fc8" style="offset-path: path('M129.0 149.0 L 480.0 149.0 L 480.0 85.0 L 597.0 85.0 L 597.0 213.0 L 831.0 213.0'); animation: r14 8.0s linear 0.0s infinite"/>
  <rect x="38" y="60" width="182" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="38" y="60" width="182" height="50" rx="7" fill="none" stroke="none"/>
  <text x="52" y="82.0" class="t" text-anchor="start">Import definition</text>
  <text x="52" y="98.0" class="b" text-anchor="start">timer start event</text>
  <rect x="38" y="124" width="182" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="38" y="124" width="182" height="50" rx="7" fill="none" stroke="none"/>
  <text x="52" y="146.0" class="t" text-anchor="start">Save workflow</text>
  <text x="52" y="162.0" class="b" text-anchor="start">waiting timer found</text>
  <rect x="38" y="188" width="182" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="38" y="188" width="182" height="50" rx="7" fill="none" stroke="none"/>
  <text x="52" y="210.0" class="t" text-anchor="start">Schedule retry</text>
  <text x="52" y="226.0" class="b" text-anchor="start">instance in error</text>
  <rect x="272" y="124" width="182" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <g class="hl" style="--d: 8.0s; --w: 0.625s"><rect x="272" y="124" width="182" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <rect x="272" y="124" width="182" height="50" rx="7" fill="none" stroke="none"/>
  <text x="286" y="146.0" class="mi" text-anchor="start">scheduler_job</text>
  <text x="286" y="162.0" class="b" text-anchor="start">upsert by tenant + job_key</text>
  <rect x="506" y="60" width="182" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <g class="hl" style="--d: 8.0s; --w: 1.8666666666666667s"><rect x="506" y="60" width="182" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <rect x="506" y="60" width="182" height="50" rx="7" fill="none" stroke="none"/>
  <text x="520" y="82.0" class="t" text-anchor="start">List due</text>
  <text x="520" y="98.0" class="b" text-anchor="start">run_at ≤ now · unlocked</text>
  <rect x="506" y="124" width="182" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <g class="hl" style="--d: 8.0s; --w: 2.1333333333333333s"><rect x="506" y="124" width="182" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <rect x="506" y="124" width="182" height="50" rx="7" fill="none" stroke="none"/>
  <text x="520" y="146.0" class="t" text-anchor="start">Claim</text>
  <text x="520" y="162.0" class="b" text-anchor="start">set locked_by</text>
  <rect x="506" y="188" width="182" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <g class="hl" style="--d: 8.0s; --w: 2.4s"><rect x="506" y="188" width="182" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <rect x="506" y="188" width="182" height="50" rx="7" fill="none" stroke="none"/>
  <text x="520" y="210.0" class="t" text-anchor="start">Run the job</text>
  <text x="520" y="226.0" class="b" text-anchor="start">start · advance · retry</text>
  <rect x="740" y="124" width="182" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="740" y="124" width="182" height="50" rx="7" fill="none" stroke="none"/>
  <text x="754" y="146.0" class="t" text-anchor="start">Reschedule</text>
  <text x="754" y="162.0" class="b" text-anchor="start">next run_at · lock cleared</text>
  <rect x="740" y="188" width="182" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <g class="hl" style="--d: 8.0s; --w: 3.375s"><rect x="740" y="188" width="182" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <rect x="740" y="188" width="182" height="50" rx="7" fill="none" stroke="none"/>
  <text x="754" y="210.0" class="t" text-anchor="start">Delete</text>
  <text x="754" y="226.0" class="b" text-anchor="start">done · consumed · stale</text>
  <path class="ln" d="M260 149.0 L 272 149.0" marker-end="url(#a)"/>
  <path class="ln" d="M494 85.0 L 506 85.0" marker-end="url(#a)"/>
  <path class="ln" d="M597.0 112 L 597.0 124" marker-end="url(#a)"/>
  <path class="ln" d="M597.0 176 L 597.0 188" marker-end="url(#a)"/>
  <path class="ln" d="M728 213.0 L 740 213.0" marker-end="url(#a)"/>
  <path class="ln" d="M220 85.0 L 232 85.0 L 232 136 L 272 136" marker-end="url(#a)"/>
  <path class="ln" d="M220 213.0 L 232 213.0 L 232 162 L 272 162" marker-end="url(#a)"/>
  <path class="ln" d="M714.0 213.0 L 714.0 149.0 L 740 149.0" marker-end="url(#a)"/>
  <text x="480" y="290" class="b" text-anchor="middle">A rescheduled job stays in the table with its next due time, so nothing is lost on restart.</text>
</svg>
