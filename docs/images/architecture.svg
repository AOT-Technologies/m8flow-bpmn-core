<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" width="960" height="316" role="img" aria-labelledby="t d">
  <title id="t">How m8flow-core fits into your application</title>
  <desc id="d">Four columns, left to right. Your application owns HTTP routes, UI, sign-in, users and tenants; runs the scheduler loop inline or from Celery; and supplies connectors and authorization policies. It calls the public API: commands and queries as frozen dataclasses, the scheduler through run_due_scheduler_jobs, and extension hooks that install registries and policies. The library services check tenant membership and command permissions, then the workflow runtime restores, advances, and saves the workflow, and service tasks run connectors in-process. Underneath, SpiffWorkflow executes BPMN, DMN, and scripts; your database stores workflow state, tasks, events, and scheduler jobs; and the connector proxy runs HTTP, SMTP, and SQL commands. A blue dot follows one call from your application through the API, authorization, and the workflow runtime into your database. The caption notes that your application owns the transaction.</desc>
  <style>
    text { font-family: Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .t { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .b { font-size: 11.5px; fill: #6b7280; }
    .k { font-size: 10px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.08em; }
    .m { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
    .mi { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #111827; }
    .ln { fill: none; stroke: #d1d5db; stroke-width: 1; }
    .er { fill: none; stroke: #e01d5a; stroke-width: 1; stroke-opacity: .45; }
    .route { offset-rotate: 0deg; opacity: 0; }
    .hl { opacity: 0; animation: hl var(--d, 6s) ease-in-out infinite; animation-delay: var(--w, 0s); }
    .in { opacity: 0; animation: fadein var(--d, 8s) ease-out infinite; animation-delay: var(--w, 0s); }
    @keyframes hl { 0%, 22%, 100% { opacity: 0; } 4%, 16% { opacity: 1; } }
    @keyframes fadein { 0% { opacity: 0; transform: translateY(4px); } 8%, 82% { opacity: 1; transform: none; }
                        92%, 100% { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 8s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 70%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .hl, .route { animation: none !important; opacity: 0; }
      .in, .bar { animation: none; opacity: 1; }
    }
  </style>
