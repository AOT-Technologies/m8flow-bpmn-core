# Pinned action SHAs are immutable; update intentionally when upgrading.
# yamllint disable rule:line-length
name: Publish m8flow-core

# Manual trigger. There is no version input: the version is read from
# pyproject.toml at the ref you dispatch from (branch or tag, chosen in the
# "Use workflow from" dropdown).
#
#   channel: release — publishes that version as-is (for example, 1.0.0).
#                      Requires a dated CHANGELOG entry and an existing
#                      GitHub Release tagged <version>, with no "v" prefix,
#                      whose tag points at the commit being built.
#   channel: beta    — publishes a PEP 440 pre-release derived from it
#                      (1.0.0 -> 1.0.0b1, then b2, b3 ...). The next beta
#                      number is resolved from what already exists on PyPI.
#                      No changelog entry or GitHub Release required.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        default: beta
        options:
          - beta
          - release

env:
  PIP_AUDIT_VERSION: "2.7.3"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Resolve the version from source and verify prerequisites before building.
  # ─────────────────────────────────────────────────────────────────────────────
  prerequisites:
    name: Verify prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    outputs:
      dist_name: ${{ steps.version.outputs.dist_name }}
      base_version: ${{ steps.version.outputs.base_version }}
      publish_version: ${{ steps.channel.outputs.publish_version }}
      channel: ${{ inputs.channel }}

    steps:
      # Every job pins to this exact commit so all artifacts come from one source.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Read version and distribution name from pyproject.toml
        id: version
        shell: python
        run: |
          import os
          import pathlib
          import re
          import sys
          import tomllib

          project = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          ).get("project", {})

          dist_name = project.get("name")
          base_version = project.get("version")
          if not dist_name or not base_version:
              print(
                  "ERROR: pyproject.toml is missing project.name or project.version",
                  file=sys.stderr,
              )
              sys.exit(1)

          # The source of truth must be a plain release version; the beta
          # channel appends the pre-release suffix itself.
          if not re.fullmatch(r"\d+\.\d+\.\d+", base_version):
              print(
                  f"ERROR: project.version {base_version!r} is not MAJOR.MINOR.PATCH",
                  file=sys.stderr,
              )
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"dist_name={dist_name}\n")
              out.write(f"base_version={base_version}\n")

          print(f"{dist_name} declares version {base_version}")

      # release -> publish the declared version as-is, and refuse if PyPI
      # already has it. beta -> next unused <base>bN on PyPI.
      - name: Resolve version for channel
        id: channel
        shell: python
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          DIST_NAME: ${{ steps.version.outputs.dist_name }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          channel = os.environ["INPUT_CHANNEL"]
          dist_name = os.environ["DIST_NAME"]
          base = os.environ["BASE_VERSION"]

          published: set[str] = set()
          url = f"https://pypi.org/pypi/{dist_name}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  published = set(json.load(resp).get("releases", {}))
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              print(f"{dist_name} has no PyPI releases yet")

          if channel == "release":
              if base in published:
                  print(
                      f"ERROR: {dist_name} {base} is already on PyPI. Bump "
                      "project.version before publishing a release.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              publish_version = base
          else:
              beta = re.compile(rf"^{re.escape(base)}b(\d+)$")
              used = [int(m.group(1)) for v in published if (m := beta.match(v))]
              publish_version = f"{base}b{max(used, default=0) + 1}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"publish_version={publish_version}\n")

          print(f"Publishing {dist_name} {publish_version} to the {channel} channel")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write(
                      "\n".join(
                          [
                              "### Publish plan",
                              "",
                              f"- Channel: {channel}",
                              f"- Distribution: {dist_name}",
                              f"- Base version: {base}",
                              f"- Publish version: {publish_version}",
                              "",
                          ]
                      )
                  )

      # Stable only: betas are cut before the changelog section is finalised.
      - name: Verify changelog
        if: inputs.channel == 'release'
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          import os
          import pathlib
          import re
          import sys

          version = os.environ["VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          heading = re.compile(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\s*$",
              re.MULTILINE,
          )
          if not heading.search(changelog):
              print(f"ERROR: CHANGELOG.md is missing a dated [{version}] section", file=sys.stderr)
              sys.exit(1)

          link_pattern = rf"^\[{re.escape(version)}\]: .+/releases/tag/{re.escape(version)}\s*$"
          if not re.search(link_pattern, changelog, re.MULTILINE):
              print(f"ERROR: CHANGELOG.md is missing the [{version}] release link", file=sys.stderr)
              sys.exit(1)

          print(f"PASS: changelog documents {version}")

      # Stable only: beta versions never get a GitHub Release. The release tag
      # must point at the commit being built, or the package and the release
      # would describe different source.
      - name: Verify GitHub Release exists and matches this commit
        if: inputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.base_version }}
          REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          tag_name="$(gh release view "$VERSION" --json tagName --jq '.tagName')"
          tag_sha="$(gh api "repos/$REPOSITORY/commits/$tag_name" --jq '.sha')"
          if [ "$tag_sha" != "$BUILD_SHA" ]; then
            echo "ERROR: release tag $tag_name points at $tag_sha, but this run checked out $BUILD_SHA." >&2
            echo "Dispatch the workflow from the $tag_name tag, or move the tag to this commit." >&2
            exit 1
          fi
          echo "PASS: release tag $tag_name points at $BUILD_SHA"

  # ─────────────────────────────────────────────────────────────────────────────
  # Test the commit, then build one pure-Python wheel and the source
  # distribution. A single py3-none-any wheel serves every supported platform.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Test and build
    needs: prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # The same checks as CI, so a publish can't skip them.
      - name: Run tests
        run: |
          uv sync --locked
          uv run --locked pytest

      # No-op on the release channel; stamps the pre-release version on beta.
      # Runs after the tests so the locked environment is unchanged.
      - name: Stamp publish version into pyproject.toml
        shell: python
        env:
          PUBLISH_VERSION: ${{ needs.prerequisites.outputs.publish_version }}
        run: |
          import os
          import pathlib
          import re
          import sys
          import tomllib

          version = os.environ["PUBLISH_VERSION"]
          pyproject = pathlib.Path("pyproject.toml")

          text = pyproject.read_text(encoding="utf-8")
          patched, count = re.subn(
              r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1
          )
          if count != 1:
              print("ERROR: no version line to patch in pyproject.toml", file=sys.stderr)
              sys.exit(1)
          pyproject.write_text(patched, encoding="utf-8")

          actual = tomllib.loads(patched)["project"]["version"]
          if actual != version:
              print(f"ERROR: patched version is {actual!r}, expected {version!r}", file=sys.stderr)
              sys.exit(1)

          print(f"PASS: building at version {version}")

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Verify artifacts
        shell: python
        env:
          PUBLISH_VERSION: ${{ needs.prerequisites.outputs.publish_version }}
        run: |
          import glob
          import os
          import sys
          import tarfile
          import zipfile

          version = os.environ["PUBLISH_VERSION"]
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              print(f"ERROR: expected one wheel and one sdist, found {wheels + sdists}", file=sys.stderr)
              sys.exit(1)
          wheel, sdist = wheels[0], sdists[0]

          if not wheel.endswith(f"m8flow_core-{version}-py3-none-any.whl"):
              print(f"ERROR: unexpected wheel name {wheel}", file=sys.stderr)
              sys.exit(1)
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              metadata = zf.read(f"m8flow_core-{version}.dist-info/METADATA").decode()

          errors = []
          compiled = [n for n in names if n.endswith((".so", ".pyd", ".c"))]
          if compiled:
              errors.append(f"wheel contains compiled files: {compiled}")
          if "m8flow_core/api.py" not in names:
              errors.append("wheel is missing m8flow_core/api.py")
          for license_file in ("LICENSE", "NOTICE"):
              if f"m8flow_core-{version}.dist-info/licenses/{license_file}" not in names:
                  errors.append(f"wheel is missing {license_file}")
          if "License-Expression: Apache-2.0" not in metadata:
              errors.append("wheel metadata does not declare Apache-2.0")

          # The sdist must hold only the allowlisted project files.
          allowed = {
              "src", "tests", "integration", "alembic", "alembic.ini", "docs",
              "examples", "sample.env", "Makefile", "README.md", "CHANGELOG.md",
              "LICENSE", "NOTICE", "pyproject.toml", "PKG-INFO", ".gitignore",
          }
          with tarfile.open(sdist) as tf:
              top = {m.name.split("/")[1] for m in tf.getmembers() if "/" in m.name}
          unexpected = sorted(top - allowed)
          if unexpected:
              errors.append(f"sdist contains unexpected top-level entries: {unexpected}")

          if errors:
              for error in errors:
                  print(f"ERROR: {error}", file=sys.stderr)
              sys.exit(1)
          print(f"PASS: {wheel} and {sdist}")

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ needs.prerequisites.outputs.publish_version }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Collect the artifacts, run supply-chain checks, publish to PyPI.
  # Uses Trusted Publisher (OIDC) — no long-lived PyPI API tokens needed.
  # Configure on PyPI: Settings → Publishing → Add a pending publisher
  # (GitHub, owner AOT-Technologies, repository m8flow-core,
  # workflow publish.yml).
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [prerequisites, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ needs.prerequisites.outputs.publish_version }}
          path: dist

      - name: Validate artifact versions match the resolved version
        shell: python
        run: |
          import glob
          import sys

          expected = "${{ needs.prerequisites.outputs.publish_version }}"
          files = glob.glob("dist/*.whl") + glob.glob("dist/*.tar.gz")
          if not files:
              print("ERROR: no artifacts found for publish", file=sys.stderr)
              sys.exit(1)
          bad = [f for f in files if f"-{expected}-" not in f and not f.endswith(f"-{expected}.tar.gz")]
          if bad:
              print(f"ERROR: version mismatch, expected {expected!r} in:", file=sys.stderr)
              for f in bad:
                  print(f"  {f}", file=sys.stderr)
              sys.exit(1)
          print(f"PASS: {len(files)} artifact(s) match version {expected!r}")

      # Written outside dist/ — pypa/gh-action-pypi-publish uploads every file
      # under packages-dir, and a checksums file isn't a valid distribution.
      - name: Record checksums
        run: |
          sha256sum dist/* | tee sha256sums.txt
          {
            echo "### Artifacts (${{ needs.prerequisites.outputs.publish_version }})"
            echo ""
            echo '```'
            cat sha256sums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums-${{ needs.prerequisites.outputs.publish_version }}
          path: sha256sums.txt
          retention-days: 30
          if-no-files-found: error

      # Install the wheel with every extra into a clean environment, so the
      # scan covers what users actually get, then audit that environment's
      # packages from outside it.
      - name: Vulnerability scan (CVE gate — blocks publish on any known vuln)
        run: |
          python -m venv "${RUNNER_TEMP}/target"
          "${RUNNER_TEMP}/target/bin/pip" install --upgrade pip
          wheel=$(ls dist/*.whl)
          "${RUNNER_TEMP}/target/bin/pip" install "${wheel}[postgresql,mysql,celery]"
          "${RUNNER_TEMP}/target/bin/pip" freeze --exclude-editable \
            | grep -v '^m8flow-core' > "${RUNNER_TEMP}/requirements.txt"
          python -m pip install "pip-audit==${{ env.PIP_AUDIT_VERSION }}"
          set +e
          pip-audit -s osv --no-deps --disable-pip --progress-spinner off \
            -r "${RUNNER_TEMP}/requirements.txt" 2>&1 | tee pip-audit.txt
          status=${PIPESTATUS[0]}
          {
            echo "### Vulnerability scan"
            echo ""
            echo '```'
            cat pip-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Publish to PyPI (Trusted Publisher / OIDC + Sigstore attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

      - name: Report PyPI publish
        run: |
          {
            echo "### Published to PyPI"
            echo "- Distribution: ${{ needs.prerequisites.outputs.dist_name }}"
            echo "- Version: ${{ needs.prerequisites.outputs.publish_version }}"
            echo "- Channel: ${{ needs.prerequisites.outputs.channel }}"
            echo "- Attestations: enabled"
          } >> "$GITHUB_STEP_SUMMARY"
