name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type, and security checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Run Ruff
        run: uv run --locked ruff check src tests alembic/versions

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run mypy
        run: uv run --locked mypy

      - name: Run Bandit
        run: uv run --locked bandit -c pyproject.toml -r src sample_app/src

      - name: Run REUSE lint
        run: uv run --locked reuse lint

  # Runs on every pull request and push. Gates total coverage at the
  # `fail_under` value in pyproject.toml and, on pull requests, holds the
  # lines the PR changes to the same threshold.
  tests:
    name: Core test suite and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # diff-cover compares against the base branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Run tests with total coverage gate
        run: >-
          uv run --locked pytest --cov=m8flow_core
          --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Gate coverage of changed lines
        if: github.event_name == 'pull_request'
        run: >-
          uv run --locked diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=80

  # Runs only after a merge to main: the remaining supported Python versions
  # and operating systems. Ubuntu with Python 3.12 is covered by `tests`.
  tests-matrix:
    name: Core test suite (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.12"

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest

  tests-postgres:
    name: Core test suite (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: m8flow_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      M8FLOW_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/m8flow_core_test
      M8FLOW_POSTGRES_UPGRADE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/m8flow_core_upgrade_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync environment
        run: uv sync --locked --extra postgresql

      - name: Create migration test database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_CONTAINER" createdb -U postgres m8flow_core_upgrade_test

      - name: Run tests and migrations
        run: uv run --locked --extra postgresql pytest

      - name: Run integration tests
        env:
          M8FLOW_TEST_POSTGRES_URL: ${{ env.M8FLOW_TEST_DATABASE_URL }}
        run: uv run --locked --extra postgresql pytest integration/

  sample-app-tests:
    name: Sample app lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            sample_app/pyproject.toml
            sample_app/uv.lock

      - name: Build library wheel
        run: uv build --wheel

      - name: Smoke test the installed wheel
        run: |
          smoke_dir="$RUNNER_TEMP/smoke"
          uv venv --python 3.12 "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I "$GITHUB_WORKSPACE/tools/smoke_test.py" \
            "$GITHUB_WORKSPACE/tests/fixtures/parallel_review_poc.bpmn" \
            --expect-installed

      - name: Stage library wheel for sample app
        run: bash sample_app/scripts/stage_local_wheel.sh

      - name: Sync sample app environment
        working-directory: sample_app
        run: uv sync --locked

      - name: Run sample app Ruff
        working-directory: sample_app
        run: uv run --locked ruff check src tests

      - name: Check sample app formatting
        working-directory: sample_app
        run: uv run --locked ruff format --check src tests

      - name: Run sample app tests
        working-directory: sample_app
        run: uv run --locked pytest
